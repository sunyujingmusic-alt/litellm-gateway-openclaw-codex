services:
  litellm-test:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm-router-codex-oauth-gmn-test
    restart: unless-stopped
    env_file:
      - ./.env.codex-oauth-gmn.test
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: ""
      all_proxy: ""
    command:
      - --config
      - /app/config.yaml
      - --host
      - 0.0.0.0
      - --port
      - "4000"
    volumes:
      - ./litellm/config.codex-oauth-gmn.test.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:4018:4000"
