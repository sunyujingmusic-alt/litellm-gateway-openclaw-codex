services:
  redis:
    image: redis:7-alpine
    container_name: litellm-router-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - no
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      - gateway

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm-router-prod
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - redis
    environment:
      REDIS_URL: redis://redis:6379
      PYTHONPATH: /app
      FAILOVER_STATS_DB_PATH: /app/failover-stats/failover_stats.sqlite3
      FAILOVER_STATS_JSONL_PATH: /app/failover-stats/failover_events.jsonl
      LITELLM_ASYNC_COOLDOWN_BRIDGE: "1"
      LITELLM_ASYNC_COOLDOWN_SECONDS: "300"
      PRIMARY_PROBE_ADMIN_KEY: ${PRIMARY_PROBE_ADMIN_KEY:?set PRIMARY_PROBE_ADMIN_KEY in .env}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: ""
      all_proxy: ""
    entrypoint:
      - python
      - /app/primary_probe_litellm_entrypoint.py
    command:
      - --config
      - /app/config.yaml
      - --host
      - 0.0.0.0
      - --port
      - "4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./scripts/failover_stats_callback.py:/app/failover_stats_callback.py:ro
      - ./scripts/primary_probe_litellm_entrypoint.py:/app/primary_probe_litellm_entrypoint.py:ro
      - ./logs/failover-stats-prod:/app/failover-stats
    ports:
      - "127.0.0.1:4002:4000"
      - "192.168.199.102:4002:4000"
    networks:
      - gateway

  primary-probe-gpt55:
    image: python:3.13-alpine
    container_name: litellm-router-prod-primary-probe-gpt55
    restart: unless-stopped
    depends_on:
      - redis
      - litellm
    environment:
      REDIS_URL: redis://redis:6379
      FAILOVER_STATS_DB_PATH: /app/failover-stats/failover_stats.sqlite3
      FAILOVER_STATS_JSONL_PATH: /app/failover-stats/failover_events.jsonl
      PROBE_DEPLOYMENT_ID: gpt-5.5
      PROBE_BASE_URL: ${CLAUDECODER_UPSTREAM_BASE_URL}
      PROBE_API_KEY: ${CLAUDECODER_UPSTREAM_API_KEY}
      PROBE_MODEL: openai/gpt-5.5
      PROBE_INTERVAL_SECONDS: "10"
      PROBE_SUCCESS_THRESHOLD: "2"
      PROBE_TIMEOUT_SECONDS: "5"
      PROBE_STATUS_KEY: gateway:health:gpt-5.5
      PROBE_RECOVERY_URL: http://litellm:4000/internal/router/cooldown/{deployment_id}
      PROBE_RECOVERY_METHOD: DELETE
      PROBE_RECOVERY_API_KEY: ${PRIMARY_PROBE_ADMIN_KEY:?set PRIMARY_PROBE_ADMIN_KEY in .env}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: ""
      all_proxy: ""
    command:
      - python
      - /app/upstream_health_probe.py
    volumes:
      - ./scripts/upstream_health_probe.py:/app/upstream_health_probe.py:ro
      - ./logs/failover-stats-prod:/app/failover-stats
    networks:
      - gateway

  primary-probe-gpt54:
    image: python:3.13-alpine
    container_name: litellm-router-prod-primary-probe-gpt54
    restart: unless-stopped
    depends_on:
      - redis
      - litellm
    environment:
      REDIS_URL: redis://redis:6379
      FAILOVER_STATS_DB_PATH: /app/failover-stats/failover_stats.sqlite3
      FAILOVER_STATS_JSONL_PATH: /app/failover-stats/failover_events.jsonl
      PROBE_DEPLOYMENT_ID: gpt-5.4
      PROBE_BASE_URL: ${CLAUDECODER_UPSTREAM_BASE_URL}
      PROBE_API_KEY: ${CLAUDECODER_UPSTREAM_API_KEY}
      PROBE_MODEL: openai/gpt-5.4
      PROBE_INTERVAL_SECONDS: "10"
      PROBE_SUCCESS_THRESHOLD: "2"
      PROBE_TIMEOUT_SECONDS: "5"
      PROBE_STATUS_KEY: gateway:health:gpt-5.4
      PROBE_RECOVERY_URL: http://litellm:4000/internal/router/cooldown/{deployment_id}
      PROBE_RECOVERY_METHOD: DELETE
      PROBE_RECOVERY_API_KEY: ${PRIMARY_PROBE_ADMIN_KEY:?set PRIMARY_PROBE_ADMIN_KEY in .env}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: ""
      all_proxy: ""
    command:
      - python
      - /app/upstream_health_probe.py
    volumes:
      - ./scripts/upstream_health_probe.py:/app/upstream_health_probe.py:ro
      - ./logs/failover-stats-prod:/app/failover-stats
    networks:
      - gateway

  failover-stats-api:
    image: python:3.13-alpine
    container_name: litellm-router-prod-stats
    restart: unless-stopped
    depends_on:
      - litellm
    environment:
      FAILOVER_STATS_HOST: 0.0.0.0
      FAILOVER_STATS_PORT: "4129"
      FAILOVER_STATS_DB_PATH: /app/failover-stats/failover_stats.sqlite3
      FAILOVER_STATS_JSONL_PATH: /app/failover-stats/failover_events.jsonl
      FAILOVER_STATS_PROMETHEUS_URL: http://litellm:4000/metrics/
      FAILOVER_STATS_CHAINS: "OpenClaw gpt-5.5:gpt-5.5,gpt-5.5-popcorn,gpt-5.5-fsys;OpenClaw gpt-5.4:gpt-5.4,gpt-5.4-popcorn,gpt-5.4-fsys"
      FAILOVER_STATS_VUE_BUNDLE: /app/vendor/vue.global.prod.js
      FAILOVER_STATS_ALLOW_RESET: "1"
      FAILOVER_STATS_LOCAL_TZ_OFFSET_HOURS: "8"
    command:
      - python
      - /app/failover_stats_api.py
    volumes:
      - ./scripts/failover_stats_api.py:/app/failover_stats_api.py:ro
      - ./logs/failover-stats-prod:/app/failover-stats
      - ./node_modules/vue/dist:/app/vendor:ro
    ports:
      - "127.0.0.1:4129:4129"
    networks:
      - gateway

networks:
  gateway:
    driver: bridge
