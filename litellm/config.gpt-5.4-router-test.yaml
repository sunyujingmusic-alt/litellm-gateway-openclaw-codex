router_settings:
  routing_strategy: simple-shuffle
  num_retries: 0
  timeout: 15
  stream_timeout: 15
  max_fallbacks: 4
  allowed_fails: 0
  retry_policy:
    BadRequestErrorRetries: 0
    AuthenticationErrorRetries: 0
    TimeoutErrorRetries: 0
    RateLimitErrorRetries: 0
    ContentPolicyViolationErrorRetries: 0
  allowed_fails_policy:
    BadRequestErrorAllowedFails: 1000
    AuthenticationErrorAllowedFails: 0
    TimeoutErrorAllowedFails: 0
    RateLimitErrorAllowedFails: 0
    ContentPolicyViolationErrorAllowedFails: 1000
  cooldown_time: 300
  redis_url: os.environ/TEST_REDIS_URL
  fallbacks:
    - gpt-5.4-router-test:
        - gpt-5.4-router-test-claudecoder
        - gpt-5.4-router-test-popcorn
        - gpt-5.4-router-test-oauth
        - gpt-5.4-router-test-gmn
    - gpt-5.5-router-test:
        - gpt-5.5-router-test-claudecoder
        - gpt-5.5-router-test-popcorn
        - gpt-5.5-router-test-oauth
        - gpt-5.5-router-test-gmn

general_settings:
  master_key: os.environ/GATEWAY_API_KEY
  drop_params: true

litellm_settings:
  set_verbose: false
  callbacks:
    - prometheus
    - failover_stats_callback.proxy_handler_instance
